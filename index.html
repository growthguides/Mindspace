<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindspace - Wellness Journaling</title>
<meta name="description" content="All-in-one wellness journaling for everyone - voice notes, AI mentor insights & weekly reports">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f8f7ff;color:#1a1a1a;padding:16px;min-height:100vh}
.container{max-width:680px;margin:0 auto}
.header{text-align:center;padding:24px 0}
.header h1{font-size:32px}.header p{color:#666;margin-top:6px}
.live{color:#00b894;font-size:12px;margin-top:4px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.07);margin-bottom:16px}
.moods{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.mood{flex:1;min-width:80px;text-align:center;padding:14px 8px;border:2px solid #eee;border-radius:14px;cursor:pointer;transition:.2s}
.mood.selected{border-color:#6c5ce7;background:#f0eeff;transform:scale(1.03)}
textarea{width:100%;min-height:120px;border:2px solid #eee;border-radius:14px;padding:14px;font-size:15px;resize:none}
textarea:focus{outline:none;border-color:#6c5ce7}
.btn{width:100%;background:#6c5ce7;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:700;font-size:15px;margin-top:14px;cursor:pointer}
.btn:disabled{opacity:.6}
.insight{margin-top:16px;padding:18px;background:#f0eeff;border-radius:14px;display:none;line-height:1.6}
.insight.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.feature{font-size:13px;color:#555;background:#f9f9ff;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Mindspace 🌙</h1>
<p>All-in-one wellness journaling - voice notes, AI mentor insights & weekly reports</p>
<div class="live">● Live & Secure - mindspace-rho-three.vercel.app</div>
</div>

<div class="card">
<h3>How are you feeling today?</h3>
<div class="moods">
<div class="mood" data-mood="happy">😊<br>Happy</div>
<div class="mood" data-mood="calm">😌<br>Calm</div>
<div class="mood" data-mood="anxious">😰<br>Anxious</div>
<div class="mood" data-mood="sad">😔<br>Sad</div>
<div class="mood" data-mood="angry">😤<br>Angry</div>
</div>
<textarea id="journal" placeholder="Today I felt... what's on your mind? Write freely, your AI mentor will give you insight."></textarea>
<button class="btn" id="saveBtn">Save & Get Insight ✨</button>
<div class="insight" id="insightBox"></div>
<div class="features">
<div class="feature">🎙️ Voice notes soon</div>
<div class="feature">📊 Weekly reports</div>
<div class="feature">🔒 Private & secure</div>
<div class="feature">🤖 AI mentor</div>
</div>
</div>
</div>

<script>
const WORKER_URL="https://mindspace.growthguides-official0924.workers.dev/";
let selectedMood=null;
document.querySelectorAll('.mood').forEach(m=>{
 m.addEventListener('click',()=>{
  document.querySelectorAll('.mood').forEach(x=>x.classList.remove('selected'));
  m.classList.add('selected'); selectedMood=m.dataset.mood;
 });
});

async function getInsight(text){
 try{
  const res=await fetch(WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({journalText:`Mood: ${selectedMood}. Journal: ${text}`})
  });
  const data=await res.json();
  return data.insight || "Nice reflection. Keep journaling daily - awareness is the first step to wellness.";
 }catch(e){
  return "Your thoughts matter. Keep writing daily - you're building self-awareness.";
 }
}

document.getElementById('saveBtn').addEventListener('click',async()=>{
 const text=document.getElementById('journal').value.trim();
 const btn=document.getElementById('saveBtn');
 const box=document.getElementById('insightBox');
 if(!text||!selectedMood){alert("Please pick a mood and write something first");return}
 btn.disabled=true; btn.textContent="Getting insight...";
 const insight=await getInsight(text);
 box.innerHTML=`<b>Your Insight ✨</b><br><br>${insight}<br><br><small style="color:#666">Mood: ${selectedMood} • Saved privately</small>`;
 box.classList.add('show');
 btn.disabled=false; btn.textContent="Saved! Write another?";
 localStorage.setItem('mindspace_last_'+Date.now(), JSON.stringify({mood:selectedMood,text,insight,date:new Date().toISOString()}));
 setTimeout(()=>{btn.textContent="Save & Get Insight ✨"; document.getElementById('journal').value="";},2500);
});
</script>
</body>
</html>
