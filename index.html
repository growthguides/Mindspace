<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindspace - Wellness Journaling</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f8f7ff;padding:16px}
.container{max-width:680px;margin:0 auto}
.header{text-align:center;padding:20px 0}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.07);margin-bottom:16px}
input{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;margin:6px 0;font-size:15px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.role{padding:12px;border:2px solid #eee;border-radius:12px;text-align:center;cursor:pointer;font-size:13px}
.role.selected{border-color:#6c5ce7;background:#f0eeff}
.mood{flex:1;min-width:70px;text-align:center;padding:10px;border:2px solid #eee;border-radius:12px;cursor:pointer;font-size:12px}
.mood.selected{border-color:#6c5ce7;background:#f0eeff}
textarea{width:100%;min-height:120px;border:2px solid #eee;border-radius:14px;padding:14px;font-size:15px}
.btn{width:100%;background:#6c5ce7;color:#fff;border:none;padding:14px;border-radius:14px;font-weight:700;margin-top:12px;cursor:pointer}
.btn-sec{background:#eee;color:#333}
.hidden{display:none}
.voice-box{border:2px solid #6c5ce7;border-radius:16px;padding:18px;text-align:center;margin:12px 0;background:#faf8ff}
.mic{width:64px;height:64px;border-radius:50%;background:#6c5ce7;color:#fff;border:none;font-size:28px;cursor:pointer}
.mic.recording{background:#ff4757;animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.dot{width:8px;height:8px;border-radius:50%;background:#ddd;display:inline-block;margin:0 2px}
.dot.active{background:#6c5ce7}
.insight{margin-top:14px;padding:16px;background:#f0eeff;border-radius:12px;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>Mindspace 🌙</h1><p>Voice journaling - speak, don't type</p><div><span class="dot active" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span><span class="dot" id="d4"></span></div></div>

<div class="card" id="step1">
<h3>👋 Welcome</h3>
<input id="name" placeholder="Your Name *">
<input id="phone" placeholder="Phone Number *">
<input id="email" placeholder="Email (optional)">
<h4 style="margin-top:10px">I am a...</h4>
<div class="role-grid">
<div class="role" data-role="High School Student">🎒 High School</div>
<div class="role" data-role="Graduating Student">🎓 Graduating</div>
<div class="role" data-role="Homemaker">🏠 Homemaker</div>
<div class="role" data-role="Teacher">👩‍🏫 Teacher</div>
<div class="role" data-role="Corporate">💼 Corporate</div>
<div class="role" data-role="Athlete">💪 Athlete</div>
</div>
<button class="btn" onclick="goStep2()">Continue →</button>
</div>

<div class="card hidden" id="step2"><h3 id="roleTitle"></h3><div id="roleQuestions"></div><button class="btn" onclick="goStep3()">Go to Voice Journal →</button></div>

<div class="card hidden" id="step3">
<h3>🎤 Just Speak Your Mind</h3>
<div class="voice-box">
<button class="mic" id="micBtn" onclick="toggleVoice()">🎤</button>
<div id="voiceStatus" style="margin-top:8px;font-weight:600;font-size:14px">Tap to start speaking</div>
<div id="voiceText" style="margin-top:6px;color:#555;font-size:13px"></div>
</div>
<textarea id="journal" placeholder="Your voice will appear here... or type"></textarea>
<div style="display:flex;gap:8px;margin:10px 0"><div class="role mood" data-mood="happy" onclick="pickMood(this)">😊 Happy</div><div class="role mood" data-mood="anxious" onclick="pickMood(this)">😰 Anxious</div><div class="role mood" data-mood="sad" onclick="pickMood(this)">😔 Low</div><div class="role mood" data-mood="tired" onclick="pickMood(this)">😴 Tired</div></div>
<button class="btn" id="saveBtn" onclick="getInsight()">Save & Get AI Mentor Insight ✨</button>
</div>

<div class="card hidden" id="step4"><h3>Your Mentor Insight ✨</h3><div class="insight" id="insightBox"></div><div style="margin-top:12px;padding:12px;background:#f9f9ff;border-radius:12px"><h4>📊 Weekly Report</h4><div id="weeklyReport" style="font-size:13px;margin-top:6px"></div></div><button class="btn" onclick="location.reload()">+ New Entry</button></div>
</div>

<script>
const WORKER_URL="https://mindspace.growthguides-official0924.workers.dev/";
let userData={}, selectedMood=null, recognition, isRecording=false;
const roleQs={"High School Student":["Which subject/exam stressing you?","Focus today 1-10?"],"Graduating Student":["Biggest career confusion?","What are you preparing for?"],"Homemaker":["What felt overwhelming today?","Time for yourself?"],"Teacher":["Which class drained you?","Work-life balance?"],"Corporate":["What work pressure today?","Hours worked?"],"Body Builder":["Training/diet today?","Goal on mind?"]};
document.querySelectorAll('.role[data-role]').forEach(r=>{r.onclick=()=>{document.querySelectorAll('.role[data-role]').forEach(x=>x.classList.remove('selected'));r.classList.add('selected');userData.role=r.dataset.role}});
function goStep2(){userData.name=document.getElementById('name').value.trim();userData.phone=document.getElementById('phone').value.trim();if(!userData.name||!userData.role){alert("Enter name & select role");return}document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');document.getElementById('d1').classList.remove('active');document.getElementById('d2').classList.add('active');document.getElementById('roleTitle').innerText=userData.role+" - 2 questions";const qs=roleQs[userData.role];document.getElementById('roleQuestions').innerHTML=`<label>${qs[0]}</label><input id="q1"><label style="margin-top:8px;display:block">${qs[1]}</label><input id="q2">`;}
function goStep3(){userData.q1=document.getElementById('q1')?.value||"";userData.q2=document.getElementById('q2')?.value||"";document.getElementById('step2').classList.add('hidden');document.getElementById('step3').classList.remove('hidden');document.getElementById('d2').classList.remove('active');document.getElementById('d3').classList.add('active');initVoice();}
function pickMood(el){document.querySelectorAll('.mood').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selectedMood=el.dataset.mood}
function initVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('voiceStatus').innerText="Use Chrome for voice";return}recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-IN';recognition.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript}document.getElementById('voiceText').innerText=t;document.getElementById('journal').value=t;};recognition.onend=()=>{if(isRecording)recognition.start();};}
function toggleVoice(){if(!recognition){alert("Use Chrome");return}const btn=document.getElementById('micBtn'),st=document.getElementById('voiceStatus');if(!isRecording){recognition.start();isRecording=true;btn.classList.add('recording');btn.innerText='⏹️';st.innerText='Listening... typing for you';}else{recognition.stop();isRecording=false;btn.classList.remove('recording');btn.innerText='🎤';st.innerText='Saved! Tap again or edit below';}}
async function getInsight(){const text=document.getElementById('journal').value.trim();if(!text||!selectedMood){alert("Speak/type & pick mood");return}document.getElementById('step3').classList.add('hidden');document.getElementById('step4').classList.remove('hidden');document.getElementById('d3').classList.remove('active');document.getElementById('d4').classList.add('active');document.getElementById('insightBox').innerText="Summarizing your answers + journal... crafting light happy insight with tips...";try{const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({journalText:`Role:${userData.role}, Name:${userData.name}, Q1:${userData.q1}, Q2:${userData.q2}, Mood:${selectedMood}, Dump:${text}`})});const data=await res.json();document.getElementById('insightBox').innerText=data.insight;const hist=JSON.parse(localStorage.getItem('mindspace_history')||"[]");hist.push({date:new Date().toLocaleDateString(),role:userData.role,mood:selectedMood,text});localStorage.setItem('mindspace_history',JSON.stringify(hist));document.getElementById('weeklyReport').innerHTML=`Entries: ${hist.length}<br>Moods: ${hist.map(h=>h.mood).join(', ')}`;}catch(e){document.getElementById('insightBox').innerText="Thank you for sharing today. 1) 3 deep breaths 2) 5-min walk 3) Drink water. See you tomorrow? 🌙"}}
</script>
</body>
</html>
